services:
  - type: web
    name: pds-tool
    env: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port 10000
    envVars:
      - key: PDS_SECRET_KEY
        generateValue: true
      - key: PDS_JWT_SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.11.0
      # QQ邮箱 SMTP
      - key: PDS_SMTP_HOST
        value: smtp.qq.com
      - key: PDS_SMTP_PORT
        value: "587"
      - key: PDS_SMTP_USER
        value: 3055350939@qq.com
      - key: PDS_SMTP_FROM
        value: 3055350939@qq.com
      - key: PDS_SMTP_USE_TLS
        value: "true"
      # 阿里云短信（请在 Render 后台填入真实值）
      - key: PDS_ALIYUN_ACCESS_KEY_ID
        sync: false
      - key: PDS_ALIYUN_ACCESS_KEY_SECRET
        sync: false
      - key: PDS_ALIYUN_SMS_SIGN_NAME
        value: 铺货通
      - key: PDS_ALIYUN_SMS_TEMPLATE_CODE
        sync: false
      # QQ邮箱 SMTP 密码（请在 Render 后台填入真实值）
      - key: PDS_SMTP_PASSWORD
        sync: false