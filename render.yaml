services:
  - type: web
    name: pds-tool
    env: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port 10000
    envVars:
      - key: PDS_SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.11.0